[project]
name = "etl-ai-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pranali", email = "pgmodgekar99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "pandas>=3.1.1",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
]

[project.scripts]
etl-ai-pipeline = "etl_ai_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
